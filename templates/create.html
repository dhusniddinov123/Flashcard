<!DOCTYPE html>
<html>
<head>
    <title>Create Collection</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <div class="form-container">
        <a href="/">⬅ Back</a>
        <h2>Create New Deck</h2>
        <form action="/create" method="POST">
            <input type="text" name="deck_name" placeholder="Deck Name (e.g. Spanish Verbs)" required class="main-input">
            
            <div id="card-inputs">
                <div class="card-input-group complex">
                    <input type="text" name="word[]" placeholder="Word" required>
                    <input type="text" name="tone[]" placeholder="Tone">
                    <input type="text" name="translation[]" placeholder="Translation" required>
                    <textarea name="example[]" placeholder="Example Sentence"></textarea>
                </div>
            </div>

            <button type="button" onclick="addMore()">+ Add Another Card</button>
            <hr>
            <button type="submit" class="btn-save">Save Collection</button>
        </form>
    </div>

    <script>
        function addMore() {
            const div = document.createElement('div');
            div.className = 'card-input-group complex';
            div.innerHTML = `
                <input type="text" name="word[]" placeholder="Word" required>
                <input type="text" name="tone[]" placeholder="Tone">
                <input type="text" name="translation[]" placeholder="Translation" required>
                <textarea name="example[]" placeholder="Example Sentence"></textarea>
            `;
            document.getElementById('card-inputs').appendChild(div);
        }
    </script>
</body>
</html>
