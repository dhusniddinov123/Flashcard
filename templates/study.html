<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studying: {{ deck.name }}</title>
    <!-- Corrected CSS path for Flask -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div id="counter">
        <a href="/" style="text-decoration: none; color: #4a90e2; margin-right: 15px;">⬅ Exit</a>
        Cards left: <span id="count-num">0</span>
    </div>

    <div class="deck-container">
        <div class="card-shadow"></div>
        
        <div id="flashcard" class="card-item">
            <div class="card-inner" id="cardInner">
                <div class="card-face card-front">
                    <p id="frontText">Loading your deck...</p>
                    <div class="swipe-indicator left-indicator">LEARNED</div>
                    <div class="swipe-indicator right-indicator">REPEAT</div>
                </div>
                <div class="card-face card-back">
                    <p id="backText">...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cards = [];
        const cardElement = document.getElementById('flashcard');
        const innerElement = document.getElementById('cardInner');
        const frontT = document.getElementById('frontText');
        const backT = document.getElementById('backText');
        const countNum = document.getElementById('count-num');
        
        let startX = 0;
        let currentX = 0;
        let isDragging = false;

        // 1. DATA LOADING (Only one source now)
        const deckId = "{{ deck.id }}";
        
        async function loadDeck() {
            try {
                const response = await fetch('/api/get_cards/' + deckId);
                if (!response.ok) throw new Error('Network response was not ok');
                cards = await response.json();
                
                if (cards.length === 0) {
                    frontT.innerText = "This deck is empty!";
                } else {
                    updateCard();
                }
            } catch (err) {
                console.error("Data Error:", err);
                frontT.innerText = "Error loading deck. Check connection.";
            }
        }

        function updateCard() {
            if (cards.length > 0) {
                frontT.innerText = cards[0].front;
                backT.innerText = cards[0].back;
                countNum.innerText = cards.length;
                innerElement.classList.remove('is-flipped');
            } else {
                frontT.innerText = "Deck Finished! 🎉";
                backT.innerText = "Great job!";
                countNum.innerText = "0";
                cardElement.style.pointerEvents = "none"; // Disable interaction when done
            }
        }

        // 2. INTERACTION LOGIC
        cardElement.addEventListener('click', () => {
            if (Math.abs(currentX) < 10) { 
                innerElement.classList.toggle('is-flipped');
            }
        });

        const start = (e) => {
            isDragging = true;
            startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            cardElement.style.transition = 'none';
        };

        const move = (e) => {
            if (!isDragging) return;
            const x = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            currentX = x - startX;
            
            const rotation = currentX / 15;
            cardElement.style.transform = `translateX(${currentX}px) rotate(${rotation}deg)`;

            // Visual cues
            if (currentX < -50) cardElement.className = 'card-item swiping-left';
            else if (currentX > 50) cardElement.className = 'card-item swiping-right';
            else cardElement.className = 'card-item';
        };

        const end = () => {
            if (!isDragging) return;
            isDragging = false;
            cardElement.style.transition = 'transform 0.4s ease-out, opacity 0.2s';

            if (currentX < -120) {
                // SWIPE LEFT: LEARNED (Remove)
                cardElement.style.transform = 'translateX(-1000px) rotate(-30deg)';
                cardElement.style.opacity = '0';
                setTimeout(() => {
                    cards.shift();
                    resetCard();
                }, 300);
            } else if (currentX > 120) {
                // SWIPE RIGHT: REPEAT (Move to back)
                cardElement.style.transform = 'translateX(1000px) rotate(30deg)';
                cardElement.style.opacity = '0';
                setTimeout(() => {
                    cards.push(cards.shift());
                    resetCard();
                }, 300);
            } else {
                // SNAP BACK
                cardElement.style.transform = 'translateX(0) rotate(0)';
            }
            currentX = 0;
        };

        function resetCard() {
            cardElement.style.transition = 'none';
            cardElement.style.transform = 'translateX(0) rotate(0)';
            cardElement.style.opacity = '1';
            cardElement.className = 'card-item';
            updateCard();
        }

        // 3. LISTENERS
        cardElement.addEventListener('mousedown', start);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);

        cardElement.addEventListener('touchstart', start);
        window.addEventListener('touchmove', (e) => {
            if (isDragging) e.preventDefault(); // Fixed: prevent phone scrolling
            move(e);
        }, {passive: false});
        window.addEventListener('touchend', end);

        // Run the load function
        loadDeck();
    </script>
</body>
</html>
